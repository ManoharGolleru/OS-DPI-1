name: AI authoring checks
on:
  push:
    branches: [feature/ai-authoring-redesign]
  pull_request:
    paths: ['src/**', 'tests/**', '.github/workflows/ai-authoring-checks.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ai-authoring-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Integrate reviewed baseline changes on the feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/ai-authoring-redesign'
        run: |
          if [ -f .github/authoring-integration.json ]; then
          python - <<'PY'
          import hashlib, json, pathlib
          allowed={'src/components/content.js','src/components/layout.js','src/db.js','src/index.html','src/start.js'}
          for change in json.loads(pathlib.Path('.github/authoring-integration.json').read_text()):
              assert change['path'] in allowed
              path=pathlib.Path(change['path'])
              original=path.read_bytes()
              actual=hashlib.sha1(b'blob '+str(len(original)).encode()+b'\0'+original).hexdigest()
              assert actual==change['sha'], 'Source changed: '+str(path)
              lines=original.decode().splitlines(keepends=True)
              for edit in reversed(change['edits']):
                  lines[edit['start']:edit['end']]=[edit['text']]
              path.write_text(''.join(lines))
          PY
          git config user.name 'OS-DPI authoring checks'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/content.js src/components/layout.js src/db.js src/index.html src/start.js
          git rm .github/authoring-integration.json
          git commit -m 'Integrate native AI authoring into the existing editor and archive path'
          git push origin HEAD:feature/ai-authoring-redesign
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install existing application dependencies
        working-directory: src
        run: npm install
      - name: Build application
        working-directory: src
        run: npm run build
      - name: Install browser test tools
        working-directory: src
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.65.0
          npx playwright install --with-deps chromium
      - name: Native browser and archive tests (simulated model replies)
        working-directory: src
        run: npx playwright test --config=tests/playwright.config.js
      - name: Native document transaction tests
        run: node --test tests/authoring.test.mjs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: authoring-browser-diagnostics
          path: src/test-results
          retention-days: 1
