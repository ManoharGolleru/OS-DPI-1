
name: Deploy OS-DPI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: src
        run: npm install

      - name: Build OS-DPI
        working-directory: src
        run: npm run build

      - name: Include repository examples
        run: |
          mkdir -p src/dist/examples
          cp -R examples/updated src/dist/examples/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: src/dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
