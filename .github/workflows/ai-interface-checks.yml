name: AI interface checks
on:
  push:
    branches: [main, feature/ai-interface-builder]
    paths: ['src/**', 'tests/**', '.github/workflows/ai-interface-checks.yml']
  pull_request:
    paths: ['src/**', 'tests/**', '.github/workflows/ai-interface-checks.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install application dependencies
        working-directory: src
        run: npm install
      - name: Native design validation tests
        run: node --test tests/ai-design.test.mjs
      - name: Build application
        working-directory: src
        run: npm run build
      - name: Install browser test tools
        working-directory: src
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.65.0
          npx playwright install --with-deps chromium
      - name: Browser and native archive integration tests (no live AI calls)
        working-directory: src
        run: npx playwright test --config=tests/playwright.config.js
